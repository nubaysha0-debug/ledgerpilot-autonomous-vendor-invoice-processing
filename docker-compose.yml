# Local demo stack: PostgreSQL 16 on :5432 and the FastAPI service on :8000.
# Usage:
#   docker compose up --build
#   curl http://localhost:8000/api/health
#
# The database is for the synthetic demo only. No live bank or payment
# credentials belong in this file or in .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerpilot
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_demo_only
    ports:
      - "5432:5432"
    volumes:
      - ledgerpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://ledger:ledger_demo_only@db:5432/ledgerpilot
      API_PORT: "8000"
      DEMO_MODE: "true"
      EXTRACTOR: mock
      LLM_PROVIDER: mock
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/backend/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations before serving. Seed happens on first startup.
    command: >
      sh -c "python -m backend.scripts.migrate &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

volumes:
  ledgerpilot_pgdata:
